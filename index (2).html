/* ---------- Typewriter hook ---------- */
function useTypewriter(text, speed = 38, startDelay = 600) {
  const [displayed, setDisplayed] = useState("");
  const [done, setDone] = useState(false);

  useEffect(() => {
    let interval;
    let i = 0;
    setDisplayed("");
    setDone(false);

    const timeout = setTimeout(() => {
      interval = setInterval(() => {
        i += 1;
        setDisplayed(text.slice(0, i));
        if (i >= text.length) {
          clearInterval(interval);
          setDone(true);
        }
      }, speed);
    }, startDelay);

    return () => {
      clearTimeout(timeout);
      clearInterval(interval);
    };
  }, [text, speed, startDelay]);

  return { displayed, done };
}

/* ---------- Background video ---------- */
function BackgroundVideo() {
  const videoRef = useRef(null);

  // Desktop: scrub with horizontal mouse movement (rAF-driven, smoothed)
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;

    let prevX = null;
    let target = 0;   // where the mouse says we should be
    let current = 0;  // smoothed position we actually seek to
    let seeking = false;
    let raf = 0;

    const onSeeked = () => { seeking = false; };

    const onMove = (e) => {
      if (window.innerWidth < 1024) return;
      const d = video.duration;
      if (!d || Number.isNaN(d)) return;
      if (prevX === null) { prevX = e.clientX; return; }
      const delta = e.clientX - prevX;
      prevX = e.clientX;
      target = Math.min(Math.max(target + (delta / window.innerWidth) * 0.8 * d, 0), d);
    };

    const tick = () => {
      raf = requestAnimationFrame(tick);
      if (window.innerWidth < 1024 || seeking) return;
      const diff = target - current;
      if (Math.abs(diff) < 0.02) return;       // ignore sub-frame changes
      current += diff * 0.18;                  // ease toward target
      seeking = true;
      if (video.fastSeek) video.fastSeek(current);
      else video.currentTime = current;
    };

    video.pause();
    video.addEventListener("seeked", onSeeked);
    window.addEventListener("mousemove", onMove, { passive: true });
    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      video.removeEventListener("seeked", onSeeked);
      window.removeEventListener("mousemove", onMove);
    };
  }, []);

  // Mobile: normal autoplay
  useEffect(() => {
    const video = videoRef.current;
    if (!video || window.innerWidth >= 1024) return;
    video.autoplay = true;
    video.play().catch(() => {});
  }, []);

  return (
    <div className="order-last lg:order-none relative lg:absolute lg:inset-0 lg:z-0 overflow-hidden pointer-events-none w-full aspect-square md:aspect-video lg:aspect-auto lg:h-full bg-neutral-900 lg:bg-transparent">

        ref={videoRef}
        src={VIDEO_SRC}
        muted

        preload="auto"
        className="w-full h-full object-cover object-right lg:object-right-bottom will-change-transform"
      />
      <div className="hidden lg:block absolute inset-0 bg-gradient-to-r from-[#0A0F0B] via-[#0A0F0B]/55 to-transparent" />
    </div>
  );
}
